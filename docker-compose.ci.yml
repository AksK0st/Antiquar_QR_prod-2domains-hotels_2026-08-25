x-backend-env: &backend-env
  APP_ENV: test
  SQL_ECHO: "false"
  LOG_LEVEL: INFO
  POSTGRES_DB: antiquar_ci
  POSTGRES_USER: antiquar_ci
  POSTGRES_PASSWORD: ci-database-password
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  PUBLIC_BASE_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  ADMIN_SESSION_TTL_HOURS: "1"
  ADMIN_IMAGE_MAX_BYTES: "1024"
  ADMIN_IMAGE_MAX_PIXELS: "40000000"
  ADMIN_LOGIN_RATE_LIMIT_ATTEMPTS: "5"
  ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
  ADMIN_LOGIN_BLOCK_SECONDS: "60"
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: antiquar-ci-app
  MINIO_SECRET_KEY: ci-storage-password
  MINIO_BUCKET: antique-images
  MINIO_SECURE: "false"

services:
  db:
    image: postgres:17.10-alpine3.24
    environment:
      POSTGRES_DB: antiquar_ci
      POSTGRES_USER: antiquar_ci
      POSTGRES_PASSWORD: ci-database-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antiquar_ci -d antiquar_ci"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    build:
      context: .
      dockerfile: ops/minio/Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: antiquar-ci-root
      MINIO_ROOT_PASSWORD: ci-root-storage-password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rm -rf /tmp/mc-health &&
          mc --config-dir /tmp/mc-health alias set health http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 &&
          mc --config-dir /tmp/mc-health ready health >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: antiquar-ci-root
      MINIO_ROOT_PASSWORD: ci-root-storage-password
      MINIO_APP_USER: antiquar-ci-app
      MINIO_APP_PASSWORD: ci-storage-password
      MINIO_BUCKET: antique-images
    volumes:
      - ./ops/minio:/config:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready local >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing "local/$${MINIO_BUCKET}";
      sed "s/__BUCKET__/$${MINIO_BUCKET}/g" /config/app-policy.template.json > /tmp/app-policy.json;
      mc admin user add local "$${MINIO_APP_USER}" "$${MINIO_APP_PASSWORD}" || true;
      mc admin policy create local antiquar-app /tmp/app-policy.json;
      mc admin policy attach local antiquar-app --user "$${MINIO_APP_USER}" || true

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  seed:
    build: ./backend
    environment: *backend-env
    command: ["/bin/sh", "-ec", "python seed.py && python minio_seed.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  bootstrap-admin:
    build: ./backend
    environment:
      <<: *backend-env
      ADMIN_BOOTSTRAP_USERNAME: ci-admin
      ADMIN_BOOTSTRAP_PASSWORD: CI-password-123456
      ADMIN_BOOTSTRAP_EXPIRED_TOKEN: ci-expired-session-token
    command: ["python", "scripts/bootstrap_admin.py"]
    depends_on:
      seed:
        condition: service_completed_successfully

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      bootstrap-admin:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUBLIC_BASE_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 2 -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    image: caddy:2.11.4-alpine
    volumes:
      - ./ops/caddy/Caddyfile.ci:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
