name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m compileall -q backend
      - run: PYTHONPATH=backend pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build

  release-smoke:
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.ci.yml config -q
          RELEASE_TAG=ci-config docker compose --env-file .env.production.example -f docker-compose.prod.yml config -q
      - name: Build and start prod-like stack
        run: docker compose -f docker-compose.ci.yml up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color
          exit 1
      - name: End-to-end release smoke
        run: python tests/smoke_release.py
      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans
